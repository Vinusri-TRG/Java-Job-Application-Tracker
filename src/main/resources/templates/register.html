
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - Job Tracker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .register-box {
            background: white;
            padding: 35px;
            width: 350px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #1e293b;
        }

        p {
            text-align: center;
            color: #64748b;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            margin-top: 7px;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            color: #dc2626;
            text-align: center;
            margin-top: 15px;
        }

        .login-link {
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="register-box">

    <h2>Create Account</h2>

    <p>Register to manage your job applications</p>

    <div class="error" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/register}" method="post">

        <label>Email Address</label>

        <input type="email"
               name="email"
               th:value="${email}"
               placeholder="Enter your email"
               required>

        <label>Password</label>

        <input type="password"
               name="password"
               placeholder="Minimum 8 characters"
               minlength="8"
               required>

        <button type="submit">Register</button>

    </form>

    <p class="login-link">
        Already have an account?
        <a th:href="@{/login}">Login</a>
    </p>

</div>

</body>
</html>
