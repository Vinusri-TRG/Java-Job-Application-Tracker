
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Login - Job Tracker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-box {
            background: white;
            padding: 35px;
            width: 350px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #1e293b;
        }

        p {
            text-align: center;
            color: #64748b;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            margin-top: 7px;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            color: #16a34a;
        }

        .error {
            text-align: center;
            margin-top: 15px;
            color: #dc2626;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h2>Welcome Back</h2>

    <p>Login to your Job Tracker account</p>

    <div class="message" th:if="${param.registered}">
        Registration successful! Please login.
    </div>

    <div class="error" th:if="${param.error}">
        Invalid email or password.
    </div>

    <div class="message" th:if="${param.logout}">
        You have logged out successfully.
    </div>

    <form th:action="@{/login}" method="post">

        <label>Email Address</label>

        <input type="email"
               name="username"
               placeholder="Enter your email"
               required>

        <label>Password</label>

        <input type="password"
               name="password"
               placeholder="Enter your password"
               required>

        <button type="submit">Login</button>

    </form>

    <p>
        Don't have an account?
        <a th:href="@{/register}">Register</a>
    </p>

</div>

</body>
</html>
